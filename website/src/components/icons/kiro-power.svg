<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 110 830 980" shape-rendering="geometricPrecision">
  <!--
    Kiro Powers mark — Ghosty with the lightning bolt, matching the Powers icon
    in the Kiro IDE activity bar.

    Lives as an ASSET (not inline JSX) so `PowerIcon.tsx` carries no `<svg
    viewBox>`: AUTOSDE's blocking `use-lucide-icons` rule forbids inline SVG in
    `src/**/*.tsx`, and lucide has no ghost+bolt glyph. This mirrors the
    established brand-mark pattern (`GithubLogo.tsx` / `GitlabLogo.tsx`), which
    renders an .svg asset through a CSS mask so the shape still inherits
    `currentColor`.

    Composed from the two authentic marks: the ghost silhouette + eyes from
    KiroGhost.tsx (identical path data to the Electron boot sequence, stroked
    rather than filled) and the bolt glyph from Kiro's marketplace "Add to Kiro"
    affordance (two subpaths under evenodd => an outline). The inner mask
    interrupts the ghost contour where the bolt crosses it so the two marks read
    as layered. Painted opaque black: a CSS mask keys on the image's ALPHA, so
    the colour here is irrelevant and the consumer supplies currentColor.
  -->
  <mask id="kiro-power-cut" maskUnits="userSpaceOnUse" x="180" y="110" width="830" height="980">
    <rect x="180" y="110" width="830" height="980" fill="#fff"/>
    <g transform="translate(150 540) scale(29)">
      <path d="M9.09283 1.625C9.82086 1.625 10.3009 2.37603 10.0057 3.0332L9.99114 3.06439L8.72015 5.66278H12.9225C13.7732 5.6628 14.2353 6.65759 13.6866 7.30774L7.59124 14.53C6.94025 15.3014 5.68635 14.7322 5.83843 13.7344L6.39135 10.1066H2.77849C2.04955 10.1066 1.56556 9.35178 1.86974 8.68933L4.84594 2.2077L4.86175 2.1748C5.03118 1.8386 5.37614 1.625 5.75469 1.625H9.09283Z" fill="#000" stroke="#000" stroke-width="2.931"/>
    </g>
  </mask>
  <g mask="url(#kiro-power-cut)">
    <path d="M398.554 818.914C316.315 1001.03 491.477 1046.74 620.672 940.156C658.687 1059.66 801.052 970.473 852.234 877.795C964.787 673.567 919.318 465.357 907.64 422.374C827.637 129.443 427.623 128.946 358.8 423.865C342.651 475.544 342.402 534.18 333.458 595.051C328.986 625.86 325.507 645.488 313.83 677.785C306.873 696.424 297.68 712.819 282.773 740.645C259.915 783.881 269.604 867.113 387.87 823.883L399.051 818.914H398.554Z" fill="none" stroke="#000" stroke-width="70" stroke-linejoin="round" stroke-linecap="round"/>
